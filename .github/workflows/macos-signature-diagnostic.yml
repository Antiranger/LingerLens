name: Diagnose published macOS signature

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - name: Inspect the exact published Apple Silicon DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signature-diagnostic" "$RUNNER_TEMP/old-dmg"
          cd "$RUNNER_TEMP/signature-diagnostic"
          curl -fsSL --retry 3 -o LingerLens-0.1.2-macos-arm64.dmg https://github.com/Antiranger/LingerLens/releases/download/v0.1.2/LingerLens-0.1.2-macos-arm64.dmg
          curl -fsSL --retry 3 -o SHA256SUMS.txt https://github.com/Antiranger/LingerLens/releases/download/v0.1.2/SHA256SUMS.txt
          grep 'LingerLens-0.1.2-macos-arm64.dmg$' SHA256SUMS.txt | shasum -a 256 -c -
          hdiutil verify LingerLens-0.1.2-macos-arm64.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/old-dmg" LingerLens-0.1.2-macos-arm64.dmg
          app="$RUNNER_TEMP/old-dmg/LingerLens.app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee identity.txt || true
          set +e
          codesign --verify --deep --strict --verbose=4 "$app" > verification.txt 2>&1
          result=$?
          set -e
          cat verification.txt
          printf 'published_signature_verification_exit=%s\n' "$result" | tee result.txt
          hdiutil detach "$RUNNER_TEMP/old-dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: published-macos-signature-diagnostic
          path: |
            ${{ runner.temp }}/signature-diagnostic/identity.txt
            ${{ runner.temp }}/signature-diagnostic/verification.txt
            ${{ runner.temp }}/signature-diagnostic/result.txt
