name: Prepare desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require a matching version tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_REF !== "v"+p.version) process.exit(1)'
  packages:
    needs: [version, verify]
    uses: ./.github/workflows/desktop.yml
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
  draft:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: LingerLens-*
          path: release
          merge-multiple: true
      - name: Checksums, update manifest and draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          installer="LingerLens-$version-windows-x64-setup.exe"
          node scripts/make-update-manifest.js "release/$installer" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$installer"
          (cd release && sha256sum *.exe *.dmg *.zip manifest.json > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release/*.exe release/*.dmg release/*.zip release/manifest.json release/SHA256SUMS.txt --verify-tag --draft --title "LingerLens $version" --notes-file .github/RELEASE_NOTES.md
