name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/hls-companion/companion/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --requirement prototype/hls-companion/companion/requirements.txt

      - name: Install browser test dependencies
        run: python -m pip install --requirement prototype/hls-companion/requirements-test.txt

      - name: Install test Chromium
        run: python -m playwright install chromium

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Fetch pinned yt-dlp (SHA-256 verified)
        run: python scripts/fetch-yt-dlp.py

      - name: Release and secret guard
        run: npm run guard:release

      - name: Tracked file completeness guard
        run: npm run guard:tracked

      - name: Python runtime import completeness guard
        run: npm run guard:python-imports

      - name: Third-party notices
        run: npm run guard:licences

      - name: Documentation links and language coverage
        run: npm run check:docs

      - name: Python compile check
        run: npm run check:python

      - name: JavaScript syntax check
        run: npm run check:js

      - name: HLS Companion tests
        run: npm run test:hls-companion

      - name: Root Node tests
        run: npm test
