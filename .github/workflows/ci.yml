name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/hls-companion/companion/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --requirement prototype/hls-companion/companion/requirements.txt

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Verify vendored yt-dlp checksum
        shell: powershell
        run: |
          $expected = ((Get-Content prototype/hls-companion/vendor/yt-dlp/yt-dlp.exe.sha256 -Encoding utf8 -Raw).Trim().Split()[0]).ToLowerInvariant()
          $actual = (Get-FileHash prototype/hls-companion/vendor/yt-dlp/yt-dlp.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Vendored yt-dlp checksum mismatch" }

      - name: Release and secret guard
        run: npm run guard:release

      - name: Tracked file completeness guard
        run: npm run guard:tracked

      - name: Third-party notices
        run: npm run guard:licences

      - name: Documentation links and language coverage
        run: npm run check:docs

      - name: Python compile check
        run: npm run check:python

      - name: JavaScript syntax check
        run: npm run check:js

      - name: HLS Companion tests
        run: npm run test:hls-companion

      - name: Root Node tests
        run: npm test
