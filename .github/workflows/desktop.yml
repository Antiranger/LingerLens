name: Windows desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: |
          python -m venv .venv-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv-desktop/Scripts/python.exe -m pip install -r desktop/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
      - name: Verify source, documentation and offline regressions
        run: |
          $env:PATH = "$PWD/.venv-desktop/Scripts;$env:PATH"
          npm run ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build runtime and test desktop contracts
        run: |
          npm run desktop:backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run desktop:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LINGERLENS_TEST_BACKEND = "$PWD/build-desktop/backend/lingerlens-backend/lingerlens-backend.exe"
          .venv-desktop/Scripts/python.exe -m unittest discover -s desktop/tests -p test_*.py
      - name: Build unsigned installer without publishing
        run: npm run desktop:dist
      - name: Check the notices cover everything that was frozen in
        run: |
          npm run guard:licences:frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: lingerlens-windows-x64-preview
          path: release/*-setup.exe
          if-no-files-found: error
