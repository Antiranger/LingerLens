name: Desktop packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            python: .venv-desktop/Scripts/python.exe
            backend: build-desktop/backend/lingerlens-backend/lingerlens-backend.exe
          - os: macos-15-intel
            platform: macos
            arch: x64
            python: .venv-desktop/bin/python
            backend: build-desktop/backend/lingerlens-backend/lingerlens-backend
          - os: macos-15
            platform: macos
            arch: arm64
            python: .venv-desktop/bin/python
            backend: build-desktop/backend/lingerlens-backend/lingerlens-backend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: |
          python -m venv .venv-desktop
          "${{ matrix.python }}" -m pip install -r desktop/requirements-build.txt
          npm ci --ignore-scripts
      - name: Verify source and desktop contracts
        run: |
          npm run guard:release
          npm run guard:tracked
          npm run guard:licences
          npm run check:docs
          npm test
          "${{ matrix.python }}" -m unittest discover -s desktop/tests -p 'test_*.py'
      - name: Freeze Windows backend
        if: runner.os == 'Windows'
        run: "${{ matrix.python }} desktop/prepare_backend.py"
      - name: Freeze macOS backend
        if: runner.os == 'macOS'
        run: "${{ matrix.python }} desktop/prepare_macos.py"
      - name: Verify bundled dependencies without system development tools
        env:
          LINGERLENS_TEST_BACKEND: ${{ github.workspace }}/${{ matrix.backend }}
        run: |
          "${{ matrix.python }}" -m unittest discover -s desktop/tests -p 'test_*.py'
          npm run guard:licences:frozen
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run desktop:dist
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config desktop/builder.cjs --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LingerLens-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*-setup.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
