name: Bug report
description: Report a reproducible product problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys, Cookie values, signed stream URLs and personal paths before submitting.
  - type: input
    id: version
    attributes:
      label: Version or build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
